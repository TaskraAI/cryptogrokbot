# Starter watchlist — well-known, liquid Solana memes.
# Edit this file. The night agent (MODE=PAPER by default) may paper-buy a mint
# listed here when DexScreener or Pump.fun shows a live Solana market AND
# scoring + config/rules.yaml pass. Real transactions require MODE=LIVE,
# MASTER_ENABLED=true, and WALLET_SECRET_KEY (dedicated hot wallet only).
#
# Add your own coins like this:
#   - mint: "<Solana mint address>"
#     ticker: TICKER
#     weight: trusted    # trusted | watch  (use trusted so one listing is enough)
